[package]
name = "headroom-version-parity"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Version-parity harness: guard Rust compressor output against recorded (previous-version) fixtures."

[lib]
path = "src/lib.rs"

[[bin]]
name = "parity-run"
path = "src/bin/parity_run.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
headroom-core = { path = "../headroom-core" }
# The recorded fixtures under tests/parity/fixtures/ freeze the accepted
# (previously Python-produced) outputs; comparators call headroom-core
# directly, so this crate needs neither pyo3 nor a Python toolchain.
